apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      name: product-frontend
  template:
    metadata:
      labels:
        name: product-frontend
    spec:
      containers:
        - name: product-frontend
          image: testdockerahmed/productfrontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
          envFrom:
            - configMapRef:
                name: api-config