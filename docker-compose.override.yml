services:
  productapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__ProductConnectionString=Server=tcp:aks-db.database.windows.net,1433;Initial Catalog=ProductDB;User ID=dbadmin;Password=Helloworld10!;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;
    expose:
      - "8080"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro

  productfrontend:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ProductApi__BaseUrl=http://productapi:8080/
    ports:
      - "80:8080"
    depends_on:
      - productapi
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro