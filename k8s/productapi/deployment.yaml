apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-api
spec:
  replicas: 2
  selector:
    matchLabels:
      name: product-api
  template:
    metadata:
      labels:
        name: product-api
    spec:
      containers:
        - name: product-api
          image: testdockerahmed/productapi:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ASPNETCORE_HTTP_PORTS
              value: "80"
            - name: ConnectionStrings__ProductConnectionString
              valueFrom:
                secretKeyRef:
                  name: sqlserver-secret
                  key: connection-string