apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      name: product-frontend
  template:
    metadata:
      labels:
        name: product-frontend
    spec:
      containers:
        - name: product-frontend
          image: testdockerahmed/productfrontend:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ASPNETCORE_HTTP_PORTS
              value: "80"
          envFrom:
            - configMapRef:
                name: api-config