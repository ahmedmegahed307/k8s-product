
name: .NET 8 Docker CI/CD - AKS

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore ProductAPI
        run: dotnet restore ./ProductAPI/ProductAPI.csproj

      - name: Restore ProductFrontend
        run: dotnet restore ./ProductFrontend/ProductFrontend.csproj

      - name: Build ProductAPI
        run: dotnet build ./ProductAPI/ProductAPI.csproj --no-restore -c Release

      - name: Build ProductFrontend
        run: dotnet build ./ProductFrontend/ProductFrontend.csproj --no-restore -c Release

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push ProductAPI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ProductAPI/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            testdockerahmed/productapi:latest
            testdockerahmed/productapi:${{ github.sha }}
          cache-from: type=gha,scope=productapi
          cache-to: type=gha,mode=max,scope=productapi

      - name: Build and Push ProductFrontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ProductFrontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            testdockerahmed/productfrontend:latest
            testdockerahmed/productfrontend:${{ github.sha }}
          cache-from: type=gha,scope=productfrontend
          cache-to: type=gha,mode=max,scope=productfrontend

  deploy-to-aks:
    name: Deploy to Azure Kubernetes Service
    runs-on: ubuntu-latest
    needs: build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    concurrency:
      group: aks-production
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Connect to AKS
        uses: azure/aks-set-context@v5
        with:
          resource-group: rg-aks
          cluster-name: aks-cluster
          admin: true

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f ./aks/productapi/
          kubectl apply -f ./aks/productfrontend/

      - name: Update ProductAPI Image
        run: kubectl set image deployment/product-api productapi=testdockerahmed/productapi:${{ github.sha }}

      - name: Update ProductFrontend Image
        run: kubectl set image deployment/product-frontend productfrontend=testdockerahmed/productfrontend:${{ github.sha }}

      - name: Verify API Deployment
        run: kubectl rollout status deployment/product-api --timeout=300s

      - name: Verify Frontend Deployment
        run: kubectl rollout status deployment/product-frontend --timeout=300s

      - name: Show Kubernetes Resources
        run: kubectl get deployments,pods,services
